name: scy-boardgame-week05
services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run setup-env.sh first}
      MYSQL_DATABASE: boardgame_club
      MYSQL_USER: boardgame
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run setup-env.sh first}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./monolith/scripts/init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks: [boardgame-network]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1
          -u"$${MYSQL_USER}" "$${MYSQL_DATABASE}" -e 'SELECT 1'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
  app:
    image: scy-boardgame:week05
    build:
      context: ./monolith
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/boardgame_club?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
      DB_USERNAME: boardgame
      DB_PASSWORD: ${MYSQL_PASSWORD:?Run setup-env.sh first}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    networks: [boardgame-network]
volumes:
  mysql-data:
networks:
  boardgame-network:
